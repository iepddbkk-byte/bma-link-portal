<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMA SMART LINKAGE - แก้ไขข้อมูลส่วนตัว</title>
    
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap"></noscript>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Theme Colors */
            --bma-green: #00963C;
            --bma-green-hover: #007a30;
            --bma-green-light: #e8f5e9;
            --button-red: #dc3545;
            --button-blue: #007bff;
            --button-yellow: #ffc107;
            --button-gray: #6c757d;
            --text-color: #2c3e50;
            --border-color: #e0e0e0;
            --bg-grad-start: #f5f7fa;
            --bg-grad-end: #c3cfe2;
            
            --header-height: 80px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        /* FIX FONT */
        body, button, input, select, textarea, optgroup {
            font-family: 'Kanit', sans-serif;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            background: linear-gradient(135deg, var(--bg-grad-start) 0%, var(--bg-grad-end) 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding-top: var(--header-height);
        }

        /* --- Header & Navigation --- */
        .main-header {
            background: white;
            padding: 0 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            height: var(--header-height);
            display: flex; align-items: center; justify-content: space-between;
            transition: all 0.3s ease;
        }

        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-container img { height: 45px; width: auto; transition: transform 0.3s; }
        .logo-container img:hover { transform: scale(1.05); }
        .logo-text { font-size: 1.4rem; font-weight: 700; color: var(--bma-green); white-space: nowrap; }

        .nav-menu { display: flex; align-items: center; gap: 8px; }

        .nav-link {
            text-decoration: none; color: var(--text-color); font-weight: 500;
            padding: 8px 16px; border-radius: 50px; transition: all 0.2s ease;
            display: flex; align-items: center; gap: 8px; font-size: 0.95rem; white-space: nowrap;
        }
        .nav-link:hover { background-color: var(--bma-green-light); color: var(--bma-green); transform: translateY(-1px); }
        .nav-link i { font-size: 1.1em; }
        
        .nav-link.active-nav { background-color: var(--bma-green); color: white; box-shadow: 0 4px 10px rgba(0, 150, 60, 0.2); }
        .nav-link.logout-btn { color: #dc3545; border: 1px solid transparent; }
        .nav-link.logout-btn:hover { background-color: #fff5f5; border-color: #dc3545; }

        .user-profile-pic { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--bma-green); object-fit: cover; }

        /* --- Mobile Header Controls --- */
        .mobile-controls { display: none; align-items: center; gap: 15px; }
        .mobile-profile-btn { display: flex; align-items: center; text-decoration: none; }
        .mobile-profile-btn img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--bma-green); object-fit: cover; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .mobile-toggle { font-size: 1.6rem; cursor: pointer; color: var(--text-color); padding: 5px; }

        /* --- Container --- */
        .container { max-width: 700px; margin: 40px auto; padding: 40px; background: white; border-radius: 20px; box-shadow: var(--shadow-lg); animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h2 {
            color: var(--bma-green); font-size: 1.8em; font-weight: 600;
            margin-bottom: 25px; padding-bottom: 10px;
            border-bottom: 2px solid var(--bma-green-light);
            display: flex; align-items: center; gap: 10px;
        }

        /* --- Form --- */
        form { display: flex; flex-direction: column; gap: 20px; }
        form div { display: flex; flex-direction: column; gap: 5px; }
        
        form label { font-weight: 600; color: var(--text-color); font-size: 0.95em; }
        
        form input, form select {
            width: 100%; padding: 12px 15px;
            border: 2px solid var(--border-color); border-radius: 10px;
            font-size: 1em; background-color: #f8f9fa; transition: all 0.3s ease;
        }
        form input:focus, form select:focus {
            outline: none; border-color: var(--bma-green); background-color: white;
            box-shadow: 0 0 0 4px var(--bma-green-light); transform: translateY(-2px);
        }
        
        /* สไตล์สำหรับช่องที่ห้ามแก้ไข */
        form input[readonly] { 
            background-color: #f1f3f5; 
            color: #6c757d; 
            cursor: not-allowed; 
            border-color: #e9ecef; 
        }

        button[type="submit"] {
            background: linear-gradient(135deg, var(--bma-green), #007a30);
            color: white; border: none; padding: 15px; border-radius: 10px;
            font-size: 1.1em; font-weight: 600; cursor: pointer;
            transition: 0.3s; box-shadow: var(--shadow-md); margin-top: 10px;
        }
        button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,150,60,0.4); }

        .btn-cancel { text-align: center; color: #6c757d; text-decoration: none; padding: 10px; font-weight: 500; transition: 0.3s; }
        .btn-cancel:hover { color: #dc3545; }

        /* Responsive */
        @media (max-width: 992px) { .nav-link span { display: none; } }
        @media (max-width: 768px) {
            .mobile-controls { display: flex; } .mobile-toggle { display: block; }
            .nav-menu { display: none; position: absolute; top: 70px; left: 0; width: 100%; background: white; flex-direction: column; padding: 15px; box-shadow: var(--shadow-lg); }
            .nav-menu.active { display: flex; }
            .nav-link { width: 100%; padding: 12px; height: auto; justify-content: flex-start; }
            .nav-link span { display: inline; }
            .nav-link.profile-item { display: none; }
            .container { padding: 25px 20px; margin: 20px 15px; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <a href="{{ url_for('home') }}" class="logo-container">
            <img src="{{ url_for('static', filename='pictures/logo.png') }}" alt="BMA Logo">
            <div class="logo-text">แก้ไขข้อมูลส่วนตัว</div>
        </a>
        
        <div class="mobile-controls">
            {% if session.get('logged_in') %}
                <a href="{{ url_for('profile_page') }}" class="mobile-profile-btn">
                    <img src="https://ui-avatars.com/api/?name={{ session.name }}&background=00963C&color=fff" alt="Profile">
                </a>
            {% endif %}
            <div class="mobile-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        </div>
    
        <nav class="nav-menu" id="navMenu">
            {% if session.get('logged_in') %}
                <a href="{{ url_for('home') }}" class="nav-link"><i class="fas fa-home"></i> <span>หน้าหลัก</span></a>
                <a href="{{ url_for('dashboard') }}" class="nav-link"><i class="fas fa-columns"></i> <span>Dashboard</span></a>
                
                <a href="{{ url_for('profile_page') }}" class="nav-link profile-item">
                    <img src="https://ui-avatars.com/api/?name={{ session.name }}&background=00963C&color=fff" class="user-profile-pic" alt="Profile">
                    <span>{{ session.name }}</span>
                </a>
                
                <a href="{{ url_for('logout') }}" class="nav-link logout-btn"><i class="fas fa-sign-out-alt"></i> <span>ออก</span></a>
            {% endif %}
        </nav>
    </header>

    <div class="container">
        <h2><i class="fas fa-user-edit"></i> แก้ไขข้อมูลส่วนตัว</h2>

        <form id="editProfileForm" action="{{ url_for('edit_profile_action') }}" method="POST">
            <div>
                <label>ชื่อ-นามสกุล <span style="color: #dc3545; font-size: 0.85em;">(ไม่สามารถแก้ไขได้)</span></label>
                <input type="text" name="fullname" value="{{ user['ชื่อ'] }}" readonly>
            </div>
            
            <div>
                <label>อีเมล <span style="color: #dc3545; font-size: 0.85em;">(ไม่สามารถแก้ไขได้)</span></label>
                <input type="email" name="email" value="{{ user['Email'] }}" readonly>
            </div>
            
            <div>
                <label>กลุ่มงาน / ฝ่าย <span style="color: #dc3545; font-size: 0.85em;">(ไม่สามารถแก้ไขได้)</span></label>
                <input type="text" name="division" value="{{ user['หน่วยงาน'] }}" readonly>
            </div>

            <div>
                <label>กอง / สำนักงาน <span style="color: #dc3545; font-size: 0.85em;">(ไม่สามารถแก้ไขได้)</span></label>
                <input type="text" name="main_agency" value="{{ user['ส่วนราชการ'] }}" readonly>
            </div>
            
            <div>
                <label>ส่วนราชการ <span style="color: #dc3545; font-size: 0.85em;">(ไม่สามารถแก้ไขได้)</span></label>
                <input type="text" value="สำนักยุทธศาสตร์และประเมินผล" readonly>
            </div>

            <hr style="border: 0; border-top: 1px dashed #ccc; margin: 10px 0;">

            <div>
                <label for="position" style="color: var(--bma-green);">ตำแหน่ง <i class="fas fa-pen"></i></label>
                <input type="text" id="position" name="position" value="{{ user['ตำแหน่ง'] }}" required>
            </div>

            <div>
                <label for="phone" style="color: var(--bma-green);">เบอร์โทรติดต่อ <i class="fas fa-pen"></i></label>
                <input type="tel" id="phone" name="phone" value="{{ user['เบอร์โทร'] | replace("'", "") }}" required>
            </div>

            <button type="submit"><i class="fas fa-save"></i> บันทึกการเปลี่ยนแปลง</button>
            <a href="{{ url_for('profile_page') }}" class="btn-cancel">ยกเลิก กลับไปหน้าโปรไฟล์</a>
        </form>
    </div>

    <script>
        function toggleMenu() { document.getElementById('navMenu').classList.toggle('active'); }

        // ทำความสะอาดเบอร์โทรศัพท์ (ลบฝนทอง)
        const phoneInput = document.getElementById('phone');
        if(phoneInput) {
            function cleanRealTime(input) {
                let val = input.value;
                if (val.includes("'")) input.value = val.replace(/'/g, ''); 
            }
            phoneInput.addEventListener('input', function(e) { cleanRealTime(e.target); });
        }

        document.getElementById('editProfileForm').addEventListener('submit', function() {
            if (phoneInput) phoneInput.value = phoneInput.value.replace(/'/g, '').trim();
        });

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                const Toast = Swal.mixin({ toast: true, position: 'top', showConfirmButton: false, timer: 3000 });
                {% for category, message in messages %} Toast.fire({ icon: '{{ category }}', title: '{{ message }}' }); {% endfor %}
            {% endif %}
        {% endwith %}
	</script>

</body>
</html>
